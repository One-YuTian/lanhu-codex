<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蓝湖接收面板</title>
<style>/* STYLES */
body{margin:0;padding:12px 16px;background:var(--color-background-primary,#fff);color:var(--color-text-primary,#1d2939);font:14px/1.6 system-ui,sans-serif}main{max-width:640px;margin:auto}header{display:flex;align-items:center;gap:8px}.mark{color:#2370e8;font-size:18px}h1{font-size:14px;margin:0}p{margin:6px 0 12px}.hint{color:var(--color-text-secondary,#667085)}.status{color:var(--color-text-secondary,#667085);font-size:12px;margin:4px 0 8px}.preview{border:1px solid var(--color-border-primary,#e5e9f0);border-radius:10px;padding:12px;margin-top:12px}h2{font-size:14px;margin:0 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace;max-height:360px;overflow:auto}summary{cursor:pointer;color:var(--color-text-secondary,#667085)}[hidden]{display:none!important}.error{color:var(--color-text-danger,#b42318)}</style></head>
<body><main><header><span class="mark" aria-hidden="true">↙</span><h1>蓝湖接收面板</h1></header>
<div id="status" class="status" role="status" aria-live="polite">正在连接当前会话…</div>
<details id="receiver-details"><summary>查看接收详情</summary>
<p class="hint">接收器连接后可折叠到后台。在蓝湖选中对象，右键选择「发送到Codex」，以页面或对象名称追加资源 mention 到当前草稿。</p>
<section id="preview" class="preview" hidden><h2 id="title"></h2><p class="hint">发送后，模型通过 MCP 资源读取每个 mention 对应的完整信息。</p><details><summary>查看完整内容</summary><pre id="content"></pre></details></section>
<p class="hint">你可以移除引用、补充要求，再手动发送。完整选区保存在本机内存中，最多保留 24 小时或最近 200 条；重启 MCP 后需重新发送。当前宿主必须支持资源引用追加。</p>
</details>
</main><script type="module">/* SCRIPT */</script></body></html>
