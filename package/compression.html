<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>蓝湖图片压缩</title>
<style>

tr{--fill:rgba(22,119,255,.09);background:linear-gradient(90deg,var(--fill) 0,var(--fill) var(--progress,0%),transparent var(--progress,0%),transparent 100%)}

.actions{overflow:visible;white-space:nowrap;text-align:right;padding-left:0;padding-right:5px}.row-action{display:inline-flex;width:24px;height:26px;padding:4px}.row-action svg{width:14px;height:14px}.retry{color:#4386d8}

</style></head><body>
<div class="toolbar" role="toolbar" aria-label="图片压缩">
<button id="files" title="添加图片" aria-label="添加图片"><svg><use href="#i-image"/></svg></button>
<button id="settings" title="设置" aria-label="设置"><svg><use href="#i-settings"/></svg></button>
<span class="spacer"></span>
<div class="task-count" id="count" role="status" aria-label="已结束任务/全部任务">0/0</div>
<button id="clear" title="全部清空" aria-label="全部清空"><svg><use href="#i-trash"/></svg></button>
<button id="clear-success" title="清空成功任务" aria-label="清空成功任务"><svg><use href="#i-clear-success"/></svg></button>
<span class="divider"></span>
<button id="retry" title="重试失败任务" aria-label="重试失败任务"><svg><use href="#i-retry"/></svg></button>
<button id="start" title="开始" aria-label="开始"><svg><use href="#i-play"/></svg></button>
<button id="pause" title="暂停" aria-label="暂停"><svg><use href="#i-pause"/></svg></button>
</div>
<div id="list" class="table" aria-label="图片列表"><table><thead><tr><th>图片</th><th>原大小</th><th>压缩后</th><th>节省</th><th>状态</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" title="添加图片" aria-label="添加图片"><svg viewBox="0 0 24 24"><use href="#i-image"/></svg></div></div>
<dialog id="settings-dialog" aria-labelledby="settings-title">
<div id="settings-form" role="form"><h2 id="settings-title">设置</h2>
<label for="setting-auto">自动开始</label><button id="setting-auto" class="settings-switch" type="button" role="switch" aria-checked="true" aria-label="自动开始"><span></span></button>
<label for="setting-concurrency">并发数</label><input id="setting-concurrency" type="number" min="1" max="20" step="1" value="5" required>
<div id="settings-error" role="alert"></div><div class="dialog-actions">
<button id="settings-cancel" class="text-button" type="button">取消</button>
<button id="settings-save" class="primary text-button" type="button">确认</button>
</div></div></dialog>
<div id="notice" role="status" aria-live="polite" hidden></div>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
<symbol id="i-clear-success" viewBox="0 0 24 24"><path d="M3 6h11M6 6l1 15h9l.4-5M8 3h5v3m2 4 3 3 4-5M10 10v7"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m10 3-.6 2.4-2 .9L5 5.6l-2 3.5 1.8 1.7v2.4L3 14.9l2 3.5 2.4-.7 2 .9L10 21h4l.6-2.4 2-.9 2.4.7 2-3.5-1.8-1.7v-2.4L21 9.1l-2-3.5-2.4.7-2-.9L14 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-retry" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
</defs></svg>
