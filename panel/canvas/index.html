<!doctype html>
<html lang="zh-CN" class="auth-checking">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>蓝湖</title><link rel="icon" href="/lanhu-logo.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/panels.css"><link rel="stylesheet" href="/ui/styles.css"><link rel="stylesheet" href="/annotations.css"></head>
<body>
  <header class="header">
    <div class="brand" title="蓝湖"><img src="/lanhu-logo.svg" alt="蓝湖 Logo"></div>
    <button id="project-name" class="project-name">项目画布</button><span class="chevron" data-icon="chevron-down"></span>
    <div class="workspace-label">设计图</div>
<div class="header-actions"><button id="help" title="快捷键" aria-label="快捷键" data-icon="circle-help"></button><button id="link-button" title="打开项目" aria-label="打开项目" data-icon="folder-open"></button><button id="share" title="复制蓝湖项目链接并在新窗口打开" aria-label="复制链接" data-icon="link"></button><button id="refresh" class="icon" title="重新加载" aria-label="重新加载" data-icon="refresh-cw"></button><span id="user-avatar" class="avatar" title="正在读取用户信息"><span data-icon="user-round"></span></span></div>
  </header>
  <main id="project-manager" class="project-manager" aria-label="项目管理" hidden></main>
  <main class="workspace">
    <aside id="sidebar" class="sidebar"><div class="side-tabs"><button class="active" id="nav-tab">项目目录</button><button id="layer-tab" hidden>图层</button><button id="toggle-search" title="搜索" aria-label="搜索" aria-expanded="false" aria-controls="search-panel" data-icon="search"></button></div><div id="search-panel" class="sidebar-search" hidden><div class="sidebar-search-field"><input id="search" placeholder="搜索设计图或分组" aria-label="搜索设计图或分组"><button id="clear-search" title="清除搜索" aria-label="清除搜索" data-icon="x"></button></div></div><div id="navigation" class="navigation"></div></aside>
    <section id="viewport" class="viewport" aria-label="设计画布" tabindex="0"><div id="world" class="world"></div><div id="marquee" class="marquee" hidden></div><div id="state" class="state"></div><div id="selection-info" class="selection-info" hidden></div><div class="toolbar"><button data-mode="select" class="active" title="选择 V" aria-label="选择" data-icon="mouse-pointer-2"></button><button data-mode="hand" title="抓手 H" aria-label="抓手" data-icon="hand"></button><span class="divider"></span><button id="zoom-out" title="缩小" aria-label="缩小" data-icon="minus"></button><button id="zoom-label" title="输入缩放比例">100%</button><button id="zoom-in" title="放大" aria-label="放大" data-icon="plus"></button><span class="divider"></span><button id="fit" title="适应画布 Ctrl+0" aria-label="适应画布" data-icon="maximize"></button><button id="actual" title="实际尺寸 Ctrl+1">1:1</button></div></section>
    <aside id="inspector" class="inspector" hidden><div class="side-tabs"><span class="inspector-title">标注</span><button id="collapse-right" class="panel-collapse" title="收起右侧面板" aria-label="收起右侧面板" data-icon="panel-right-close"></button></div><div id="properties" class="properties"></div></aside>
  </main>
  <div id="context-menu" class="context-menu" hidden></div><div id="toast" class="toast" role="status" hidden></div>
  <dialog id="project-picker" class="project-picker-dialog" aria-labelledby="project-picker-title"><div class="project-picker-header"><h2 id="project-picker-title">打开项目</h2><button id="import-project" title="从链接导入项目" aria-label="从链接导入项目" data-icon="import"></button><button id="close-project-picker" title="关闭项目选择" aria-label="关闭项目选择" data-icon="x"></button></div><div id="project-picker-content" class="project-manager"></div><footer><button id="cancel-project" type="button">取消</button><button id="confirm-project" class="primary" type="button" disabled>确认</button></footer></dialog>
  <dialog id="link-dialog"><form id="link-form"><h2>从链接导入项目</h2><p>粘贴蓝湖项目或设计稿链接，导入后立即打开。</p><label for="project-url">蓝湖链接</label><input id="project-url" placeholder="https://lanhuapp.com/web/#/item/project/stage?pid=…&tid=…" required><div id="link-error" class="error"></div><footer><button type="button" id="cancel-link">取消</button><button class="primary" type="submit">导入并打开</button></footer></form></dialog>
  <dialog id="clipboard-project-dialog" aria-labelledby="clipboard-project-title"><h2 id="clipboard-project-title">发现蓝湖项目</h2><p>剪贴板中的链接指向项目「<strong id="clipboard-project-name"></strong>」，是否前往该项目？</p><footer><button type="button" id="clipboard-project-dismiss">不打开</button><button type="button" id="clipboard-project-open" class="primary">前往项目</button></footer></dialog>
  <script type="module" src="/app.js"></script>
</body></html>
